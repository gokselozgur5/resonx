<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESONX // Industrial DSP Synthesizer & Modular Rack</title>
  <link rel="stylesheet" href="web/styles.css">
</head>
<body>
  <main class="synth-container">
    <header class="synth-header">
      <div class="brand-section">
        <h1 class="synth-title">RESONX</h1>
        <span class="synth-model">MODEL-01 // POLYPHONIC DSP RACK</span>
      </div>
      <div class="header-status">
        <span id="status-badge" class="badge">STANDBY — CLICK TO ENGAGE</span>
      </div>
    </header>

    <section class="controls-bar">
      <div class="preset-selector-group">
        <label for="preset-select">Preset</label>
        <select id="preset-select" class="custom-select">
          <option value="analog-bass">01: Analog Bass (Punchy)</option>
          <option value="blade-pad">02: Blade Runner (Vangelis)</option>
          <option value="acid-303">03: Acid 303 (Screamer)</option>
          <option value="sub-pluck">04: Sub Pluck (Tight)</option>
          <option value="fm-bell">05: FM Bell (Metallic)</option>
        </select>
      </div>

      <div class="action-buttons">
        <button id="demo-btn" class="mech-btn">
          <span class="btn-indicator"></span>
          <span id="demo-text">PLAY DEMO ARP</span>
        </button>
        <button id="record-btn" class="mech-btn">
          <span class="btn-indicator"></span>
          <span id="record-text">RECORD WAV</span>
        </button>
      </div>
    </section>

    <section class="display-unit">
      <div class="display-hud">
        <span>CRT PHOSPHOR OSCILLOSCOPE // 48 kHz</span>
        <span id="scope-status">60 FPS REAL-TIME FFT</span>
      </div>
      <canvas id="visualizer-canvas" width="960" height="140"></canvas>
    </section>

    <section class="rack-grid">
      <!-- MODULE 1: DUAL OSCILLATORS -->
      <div class="rack-module">
        <div class="module-header">
          <h2 class="module-title">OSCILLATORS</h2>
          <span class="module-tag">MOD-01</span>
        </div>
        <div class="knobs-container">
          <div id="knob-detune"></div>
          <div id="knob-envAmount"></div>
        </div>
      </div>

      <!-- MODULE 2: MOOG LADDER FILTER -->
      <div class="rack-module">
        <div class="module-header">
          <h2 class="module-title">MOOG 24dB LADDER</h2>
          <span class="module-tag">VCF-02</span>
        </div>
        <div class="knobs-container">
          <div id="knob-cutoff"></div>
          <div id="knob-resonance"></div>
          <div id="knob-drive"></div>
        </div>
      </div>

      <!-- MODULE 3: FAST ADSR ENVELOPE -->
      <div class="rack-module">
        <div class="module-header">
          <h2 class="module-title">ADSR ENVELOPE</h2>
          <span class="module-tag">EG-03</span>
        </div>
        <div class="knobs-container">
          <div id="knob-attack"></div>
          <div id="knob-decay"></div>
          <div id="knob-sustain"></div>
          <div id="knob-release"></div>
        </div>
      </div>

      <!-- MODULE 4: LFO & STEREO EFFECTS -->
      <div class="rack-module">
        <div class="module-header">
          <h2 class="module-title">LFO & FX</h2>
          <span class="module-tag">DSP-04</span>
        </div>
        <div class="knobs-container">
          <div id="knob-lfoRate"></div>
          <div id="knob-lfoDepth"></div>
          <div id="knob-delayMix"></div>
          <div id="knob-reverbMix"></div>
        </div>
      </div>
    </section>

    <section class="keyboard-section">
      <div id="keyboard-container" class="keyboard-container"></div>
    </section>
  </main>

  <script type="module" src="web/app.js"></script>
</body>
</html>
